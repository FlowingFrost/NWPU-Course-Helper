[package]
name = "course-helper-tray"
version = "0.1.0"
edition = "2021"

[dependencies]
tray-icon = "0.21"
tao = "0.31"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winres = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
